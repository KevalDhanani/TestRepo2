<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accessible Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculator" role="application">
      <div class="display-wrap">
        <output
          id="display"
          class="display"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          aria-label="Calculator display"
        >0</output>
      </div>

      <div class="keys" role="group" aria-label="Calculator keys">
        <!-- Top row: clear, backspace, toggle sign, divide -->
        <button type="button" class="key key-func" data-action="clear" aria-label="All clear">AC</button>
        <button type="button" class="key key-func" data-action="backspace" aria-label="Backspace">⌫</button>
        <button type="button" class="key key-func" data-action="toggle-sign" aria-label="Toggle sign">+/-</button>
        <button type="button" class="key key-op" data-action="divide" aria-label="Divide">÷</button>

        <!-- Row: 7 8 9 multiply -->
        <button type="button" class="key" data-digit="7" aria-label="Seven">7</button>
        <button type="button" class="key" data-digit="8" aria-label="Eight">8</button>
        <button type="button" class="key" data-digit="9" aria-label="Nine">9</button>
        <button type="button" class="key key-op" data-action="multiply" aria-label="Multiply">×</button>

        <!-- Row: 4 5 6 subtract -->
        <button type="button" class="key" data-digit="4" aria-label="Four">4</button>
        <button type="button" class="key" data-digit="5" aria-label="Five">5</button>
        <button type="button" class="key" data-digit="6" aria-label="Six">6</button>
        <button type="button" class="key key-op" data-action="subtract" aria-label="Subtract">−</button>

        <!-- Row: 1 2 3 add -->
        <button type="button" class="key" data-digit="1" aria-label="One">1</button>
        <button type="button" class="key" data-digit="2" aria-label="Two">2</button>
        <button type="button" class="key" data-digit="3" aria-label="Three">3</button>
        <button type="button" class="key key-op" data-action="add" aria-label="Add">+</button>

        <!-- Bottom row: 0 . equals -->
        <button type="button" class="key span-2" data-digit="0" aria-label="Zero">0</button>
        <button type="button" class="key" data-action="dot" aria-label="Decimal point">.</button>
        <button type="button" class="key key-equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
